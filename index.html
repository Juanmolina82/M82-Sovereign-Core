<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M82 EXECUTIVE TERMINAL // SOVEREIGN CORE</title>
    <style>
        :root {
            --bg-dark: #05080e;
            --panel-bg: #070c12;
            --border-color: #112233;
            --accent-blue: #00e5ff;
            --accent-red: #ff3344;
            --text-dim: #708090;
        }
        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Consolas', 'Segoe UI', monospace;
            margin: 0;
            padding: 8px;
        }
        .m82-media-wire-container {
            display: flex;
            gap: 10px;
            width: 100%;
            height: 420px;
            background: var(--bg-dark);
            border: 1px solid rgba(0, 229, 255, 0.2);
            padding: 8px;
            box-sizing: border-box;
        }
        .studio-video-box {
            flex: 6;
            display: flex;
            flex-direction: column;
            background: #000;
            border: 1px solid var(--border-color);
        }
        .studio-header, .news-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0a1018;
            padding: 6px 10px;
            font-size: 11px;
            color: var(--accent-blue);
        }
        .video-embed-wrapper {
            position: relative;
            flex: 1;
        }
        .video-embed-wrapper iframe {
            width: 100%;
            height: 100%;
            background: #000;
        }
        .top-news-box {
            flex: 4;
            display: flex;
            flex-direction: column;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }
        .news-feed-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            font-size: 11px;
        }
        .news-item {
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px dashed #1a2936;
            color: #c0c0c0;
        }
        .news-item.urgent {
            color: var(--accent-red);
            background: rgba(255, 51, 68, 0.07);
            padding: 4px;
        }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--accent-red);
            border-radius: 50%;
            margin-right: 6px;
            animation: blink 1s infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }
        @media(max-width: 900px) {
            .m82-media-wire-container { flex-direction: column; height: 720px; }
        }
    </style>
</head>
<body>

<!-- M82 MEDIA & TOP NEWS WIRE MATRIX — SOVEREIGN -->
<div class="m82-media-wire-container">
  <div class="studio-video-box">
    <div class="studio-header">
      <span><span class="status-dot"></span> M82 LIVE MEDIA BROADCAST — 156 DAEMONS</span>
      <select id="streamSelector" onchange="switchStudioStream(this.value)" style="background:#05080e; color:#00e5ff; border:1px solid #112233; font-size:10px;">
        <option value="bloomberg_yt">Bloomberg TV Live (YouTube)</option>
        <option value="cnbc_yt">CNBC Live (YouTube)</option>
        <option value="reuters">Reuters Live</option>
        <option value="m82_custom">M82 Studio (YouTube ID)</option>
      </select>
    </div>
    <div class="video-embed-wrapper">
      <iframe id="liveStudioPlayer" src="https://www.youtube.com/embed/dp8PhLsUcFE?autoplay=1&mute=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
  </div>
  <div class="top-news-box">
    <div class="news-header">
      <span>M82-SOVEREIGN-CORE TOP NEWS & BREAKING WIRE</span>
      <span class="wire-status" id="wireStatus">SYNC 100% — MEREY $93.92</span>
    </div>
    <div class="news-feed-scroll" id="m82NewsFeed"></div>
  </div>
</div>

<script>
function switchStudioStream(v){
 const p=document.getElementById('liveStudioPlayer');
 if(v==='m82_custom'){
  let customId = prompt('Pega YouTube Live ID M82 Studio:','');
  if(customId) p.src = `https://www.youtube.com/embed/${customId}?autoplay=1&mute=1`;
  return;
 }
 const m={
  'bloomberg_yt':'https://www.youtube.com/embed/dp8PhLsUcFE?autoplay=1&mute=1',
  'cnbc_yt':'https://www.youtube.com/embed/pw3y2q_Y3nM?autoplay=1&mute=1',
  'reuters':'https://www.youtube.com/embed/5qap5aO4i9A?autoplay=1&mute=1'
 };
 if(m[v]) p.src=m[v];
}
async function loadSovereignWire(){
 try{
  const r=await fetch('/api/stream'); const j=await r.json();
  const feed=document.getElementById('m82NewsFeed');
  feed.innerHTML=j.map(e=>`<div class="news-item ${e.priority=='URGENT'?'urgent':''}"><span class="news-time" style="color:#708090; margin-right:5px;">${e.created_at||''}</span><span class="news-tag" style="color:#00e5ff; font-weight:bold; margin-right:5px;">[${e.daemon_source||'M82'}]</span><p style="margin:2px 0 0 0; color:#e0e0e0;">${e.headline||e.title||''}</p></div>`).join('');
  document.getElementById('wireStatus').textContent=`SYNC 100% — ${j.length} WIRES — BUNKER 0.30x`;
 }catch(e){ document.getElementById('m82NewsFeed').innerHTML='<div class="news-item">Wire syncing... m82_multi_stream WAL</div>' }
}
setInterval(loadSovereignWire,60000); loadSovereignWire();
</script>

</body>
</html>
