<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>M82 Sovereign Core V63.0.01-A</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
        body { background: #070a12; color: #e2e8f0; padding: 8px; font-size: 11px; }
        .container { max-width: 950px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
        .card { background: #0b1120; border: 1px solid #1e293b; border-radius: 4px; padding: 8px; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #0284c7; padding-bottom: 4px; }
        .title-text { font-weight: bold; color: #38bdf8; font-size: 12px; }
        .subheader-bar { display: flex; justify-content: space-between; color: #94a3b8; background: #0f172a; padding: 4px 8px; border-left: 3px solid #10b981; }
        .wire-card { border-left: 3px solid #ef4444; background: #180909; }
        .wire-title { color: #ef4444; font-weight: bold; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 4px; }
        .data-card { background: #0f172a; border: 1px solid #1e293b; padding: 6px; display: flex; justify-content: space-between; }
        .up { color: #10b981; } .down { color: #ef4444; }
        .footer-banner { background: #991b1b; color: #fff; text-align: center; font-weight: bold; padding: 5px; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card header-bar">
            <span class="title-text">🟢 M82 SOVEREIGN CORE MONITOR</span>
            <span style="color:#f59e0b">LOCK: 0.30x | DRY POWDER: 100%</span>
        </div>
        <div class="subheader-bar">
            <span id="anchor-wire">MEREY 16: $93.92 | BRENT: $97.76 | WTI: $90.67</span>
            <span id="sys-clock" style="color:#38bdf8">--:--:-- VET</span>
        </div>
        <div class="card wire-card">
            <div class="wire-title">🚨 M82 SOVEREIGN WIRE</div>
            <div id="wire-news">Sincronizando malla telemétrica...</div>
        </div>
        <div class="card">
            <div style="color:#38bdf8;font-weight:bold;margin-bottom:4px">📊 EQUITIES & COMMODITIES</div>
            <div class="grid-container" id="equities-grid"></div>
        </div>
        <div class="footer-banner">🔒 BUNKER MODE // OPERACIÓN AUTÓNOMA</div>
    </div>
    <script>
        let isFetching = false;
        async function updatePWA() {
            if (isFetching) return;
            isFetching = true;
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 3500);
            try {
                const res = await fetch('/data.json?t=' + Date.now(), { cache: 'no-store', signal: controller.signal });
                clearTimeout(timeoutId);
                const data = await res.json();
                document.getElementById('sys-clock').innerText = data.timestamp || 'VET';
                if (data.wire) document.getElementById('wire-news').innerText = data.wire;
                if (data.equities) {
                    let g = '';
                    for (const [k, v] of Object.entries(data.equities)) {
                        let chg = v.change !== undefined ? v.change : 0;
                        let cls = chg >= 0 ? 'up' : 'down';
                        g += `<div class="data-card"><strong>${k}:</strong> <span>$${v.last} <span class="${cls}">(${chg >= 0 ? '+' : ''}${chg}%)</span></span></div>`;
                    }
                    document.getElementById('equities-grid').innerHTML = g;
                }
            } catch (e) {
                clearTimeout(timeoutId);
            } finally {
                isFetching = false;
            }
        }
        updatePWA();
        setInterval(updatePWA, 5000);
    </script>
</body>
</html>
