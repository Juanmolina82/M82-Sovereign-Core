<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MOLINA82 | Private Agent</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:monospace}
  html,body{height:100%;background:#0a0f14;color:#c7d1db;display:flex;flex-direction:column;overflow:hidden}
  header{padding:10px;background:#111820;border-bottom:1px solid #1e2a36;display:flex;justify-content:space-between;align-items:center}
  h1{font-size:13px;color:#00ff88}
  #chat{flex:1;padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;min-height:0}
  .msg{padding:8px 12px;border-radius:6px;font-size:12px;line-height:1.4;border:1px solid #1e2a36;max-width:90%}
  .user{align-self:flex-end;background:#111820;border-color:#00e5ff;color:#fff}
  .agent{align-self:flex-start;background:#0e1720;color:#00ff88}
  .composer{padding:10px;background:#111820;border-top:1px solid #1e2a36;display:flex;gap:6px}
  input{flex:1;background:#0a0f14;border:1px solid #1e2a36;color:#fff;padding:10px;border-radius:4px;outline:none;font-size:14px}
  button{background:#00ff88;color:#000;border:none;padding:0 16px;border-radius:4px;font-weight:bold;font-size:16px}
</style>
</head>
<body>
<header>
  <h1>MOLINA82_AGENT</h1>
  <div id="st" style="font-size:10px;color:#6b7a8a">● ONLINE</div>
</header>
<div id="chat">
  <div class="msg agent">MOLINA82 ONLINE. Nodo Charallave listo.</div>
</div>
<div class="composer">
  <input id="q" placeholder="Escribe aquí tu consulta..." autocomplete="off">
  <button id="send">▶</button>
</div>
<script>
const chat=document.getElementById('chat'), q=document.getElementById('q'), send=document.getElementById('send'), st=document.getElementById('st');
function add(t,w){
  const d=document.createElement('div');
  d.className=`msg ${w}`;
  d.innerText=t;
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
}
async function ask(){
  const m=q.value.trim(); if(!m) return;
  add(m,'user'); q.value=''; send.disabled=true; st.innerText='● CONSULTANDO...';
  try{
    const r=await fetch('http://127.0.0.1:8083/v1/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer MOLINA82-BLINDAJE-2026-CHARALLAVE'},
      body:JSON.stringify({message:m})
    });
    const d=await r.json();
    add(d.response || d.answer || JSON.stringify(d),'agent');
    st.innerText='● ONLINE';
  }catch(e){
    add('⚠️️ Error de conexión con el Backend (8083)','agent');
    st.innerText='● ERROR';
  }finally{
    send.disabled=false;
  }
}
send.onclick=ask;
q.onkeydown=e=>{if(e.key==='Enter')ask()};
</script>
</body>
</html>
