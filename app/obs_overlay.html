<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>M82 OBS OVERLAY TICKER</title>
<style>
  body { background: transparent; color: #00ff88; font-family: monospace; margin: 0; padding: 10px; overflow: hidden; }
  .ticker-box { background: rgba(10, 10, 10, 0.90); border: 1px solid #00ff88; border-radius: 6px; padding: 10px; font-size: 13px; }
  .title { font-weight: bold; color: #00ccff; }
  .bunker { color: #ffcc00; font-weight: bold; float: right; }
  .wire { color: #ffffff; margin-top: 5px; font-size: 12px; }
</style>
</head>
<body>
<div class="ticker-box">
  <span class="title">⚡ M82 MACRO DOSSIER // CARACAS-CHARALLAVE</span>
  <span class="bunker">🔒 BUNKER 0.30x LOCK</span>
  <div id="wire-text" class="wire">Cargando telemetría en vivo...</div>
</div>
<script>
async function updateOBS() {
  try {
    const r = await fetch('/data.json');
    const d = await r.json();
    document.getElementById('wire-text').innerText = d.wire || 'M82 BUS ONLINE';
  } catch(e) {}
}
setInterval(updateOBS, 3000);
updateOBS();
</script>
</body>
</html>
